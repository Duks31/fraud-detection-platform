name: Sentinel CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r serving_api/requirements.txt
          pip install pytest httpx
    
      - name: Run Unit Tests
        run: |
            cd serving_api
            pytest            

      - name: Build Docker Image
        run: |
          docker build -t sentinel-api:latest ./serving_api