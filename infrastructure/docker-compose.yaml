services:
  db: # shared between mlflow and airflow and Feast
    image: postgres:13
    container_name: sentinel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_network

  s3:
    image: minio/minio:latest
    container_name: sentinel_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sentinel_network

  mlflow:
    build: .
    container_name: sentinel_mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_ARTIFACT_URI: s3://${MLFLOW_BUCKET_NAME}/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
      --allowed-hosts '*'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel_network

  redis:
    image: redis:alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --dir /data
    networks:
      - sentinel_network

  serving_api:
    build:
      context: ../serving_api
    container_name: sentinel_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../feature_store:/app/feature_store
      - ../serving_api/main.py:/app/main.py
    depends_on:
      - mlflow
      - redis
    networks:
      - sentinel_network
    restart: on-failure

  dashboard:
    build:
      context: ../dashboard
    container_name: sentinel_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - serving_api
    networks:
      - sentinel_network
  
  airflow_webserver:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    container_name: sentinel_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow_db
      - AIRFLOW__WEBSERVER__SECRET_KEY=yoursecretkeyhere12345
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ../airflow_dags:/opt/airflow/dags            # ← Go UP one level
      - ../feature_store:/app/feature_store          # ← Go UP one level
      - ../train_model.py:/app/train_model.py        # ← Go UP one level
      - ../data:/app/data                            # ← Go UP one level
      - ./.env:/app/.env 
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init && 
               airflow users create --username airflow --password airflow --firstname Sentinel --lastname Admin --role Admin --email admin@sentinel.com && 
               airflow webserver"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel_network

  airflow-scheduler:
    build: 
      context: .
      dockerfile: airflow.Dockerfile
    container_name: sentinel_scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow_db
      - AIRFLOW__WEBSERVER__SECRET_KEY=yoursecretkeyhere12345
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ../airflow_dags:/opt/airflow/dags            # ← Go UP one level
      - ../feature_store:/app/feature_store          # ← Go UP one level
      - ../train_model.py:/app/train_model.py        # ← Go UP one level
      - ../data:/app/data                            # ← Go UP one level
      - ./.env:/app/.env 

    command: scheduler
    depends_on:
      db:
        condition: service_healthy
      airflow_webserver:
        condition: service_started
    networks:
      - sentinel_network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  sentinel_network:
    driver: bridge