services:
  # 1. METADATA DATABASE (Postgres)
  db:
    image: postgres:13
    container_name: sentinel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_network

  # 2. ARTIFACT STORAGE (MinIO - S3 Compatible)
  s3:
    image: minio/minio:latest
    container_name: sentinel_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sentinel_network

  # 3. EXPERIMENT TRACKING (MLflow)
  mlflow:
    build: .
    # image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: sentinel_mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_ARTIFACT_URI: s3://${MLFLOW_BUCKET_NAME}/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel_network

  # 4. ONLINE FEATURE STORE (Redis)
  redis:
    image: redis:alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --dir /data
    networks:
      - sentinel_network

  serving_api:
    build:
      context: ../serving_api
    container_name: sentinel_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mlflow
      - redis
    networks:
      - sentinel_network
    restart: on-failure

  dashboard:
    build:
      context: ../dashboard
    container_name: sentinel_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - serving_api
    networks:
      - sentinel_network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  sentinel_network:
    driver: bridge
